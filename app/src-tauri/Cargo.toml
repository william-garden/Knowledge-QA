[package]
name = "knowledge-qa-app"
version = "0.1.0"
description = "Knowledge QA Desktop Application"
authors = ["Knowledge QA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

