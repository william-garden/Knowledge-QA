[project]
name = "personal-knowledge-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for personal knowledge base QA robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.3.0",
  "aiofiles>=23.2.1",
  "langchain>=0.2.12",
  "langchain-community>=0.2.11",
  "langchain-openai>=0.1.21",
  "chromadb>=0.5.5",
  "pypdf>=4.2.0",
  "tiktoken>=0.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "anyio>=4.4.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
